# Builds the Don't Fret the Gut site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Custom domain: add a repository variable SITE_DOMAIN (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. dontfretthegut.org, point the domain's DNS at GitHub Pages, and
# set the same domain under Settings -> Pages. The workflow then builds for the root path and
# writes the CNAME file automatically.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dftg-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dftg-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dftg-site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build (prerendered) for GitHub Pages
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            export VITE_BASE=/ VITE_SITE_URL="https://$SITE_DOMAIN"
          else
            export VITE_BASE=/DFTG/ VITE_SITE_URL="https://briankthegreat-cyber.github.io/DFTG"
          fi
          npx vite build
          node scripts/prerender.mjs
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dftg-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
