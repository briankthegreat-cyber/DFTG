name: Codex decoder pass

on:
  push:
    branches:
      - claude/new-session-ommg9f

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-ommg9f
          fetch-depth: 0

      - name: Apply prepared decoder patch
        shell: bash
        run: |
          cat > /tmp/anatomy.patch.gz.b64 <<'PATCH_B64'

          PATCH_B64
          base64 -d /tmp/anatomy.patch.gz.b64 > /tmp/anatomy.patch.gz
          gzip -dc /tmp/anatomy.patch.gz > /tmp/anatomy.patch
          git apply --check /tmp/anatomy.patch
          git apply /tmp/anatomy.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm 10
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate committed development fixture
        run: pnpm generate:fixture

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate anatomy assets
        run: pnpm validate:anatomy-assets

      - name: Verify exact external-preview policy failure
        shell: bash
        run: |
          set +e
          output="$(pnpm validate:anatomy-assets -- --policy external_preview 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$(printf '%s\n' "$output" | grep -c '^ERROR ')" -eq 1
          test "$(printf '%s\n' "$output" | grep -c 'FIX-G-RESTRICTED')" -eq 1
          printf '%s\n' "$output" | grep -F '1 error(s), 0 warning(s)'

      - name: Install Playwright Chromium
        run: pnpm --filter @anatomy/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/codex-decoder-pass.yml
          git status --short
          git add -A
          git config user.name 'Codex via GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire manifest-driven GLB compression decoders'
          git push origin HEAD:claude/new-session-ommg9f
